<!DOCTYPE html>
<html lang="el">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>GameVault // Κατάλογος Παιχνιδιών</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="32x32" href="icon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="icon-16.png">
<link rel="shortcut icon" href="favicon.ico">
<link rel="apple-touch-icon" sizes="180x180" href="icon-180.png">
<meta name="theme-color" content="#0a0714">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="GameVault">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Rajdhani:wght@400;500;600;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  :root{
    --void: #0a0714;
    --panel: #150f28;
    --panel-2: #1c1436;
    --line: #3a2a5c;
    --line-bright: #6b4fb8;
    --text: #ece7fa;
    --muted: #8f7fb8;
    --neon-pink: #ff2e97;
    --neon-cyan: #00f0ff;
    --neon-purple: #a855f7;
    --neon-yellow: #ffe14d;
    --neon-red: #ff3860;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;overflow-x:hidden;max-width:100vw;}
  body{
    background:
      radial-gradient(ellipse 80% 50% at 50% -10%, rgba(168,85,247,0.25), transparent),
      radial-gradient(ellipse 60% 40% at 90% 10%, rgba(0,240,255,0.12), transparent),
      var(--void);
    color: var(--text);
    font-family: 'Rajdhani', sans-serif;
    min-height:100vh;
    background-attachment: fixed;
  }
  ::selection{ background: var(--neon-pink); color:#0a0714; }

  .horizon{ position: relative; overflow: hidden; border-bottom: 1px solid var(--line-bright); padding-bottom: 2px; }
  .horizon::before{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height: 140px;
    background-image:
      linear-gradient(rgba(255,46,151,0.5) 1px, transparent 1px),
      linear-gradient(90deg, rgba(255,46,151,0.5) 1px, transparent 1px);
    background-size: 44px 24px;
    -webkit-mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    mask-image: linear-gradient(to top, rgba(0,0,0,0.9), transparent);
    transform: perspective(220px) rotateX(55deg);
    transform-origin: bottom;
    pointer-events: none;
    opacity: 0.55;
  }
  .horizon::after{
    content:"";
    position:absolute; left:0; right:0; bottom:0; height: 2px;
    background: linear-gradient(90deg, transparent, var(--neon-pink), var(--neon-cyan), transparent);
    box-shadow: 0 0 14px 2px rgba(255,46,151,0.7);
  }

  header.hero{ position: relative; z-index: 2; padding: 52px 24px 130px; max-width: 1180px; margin: 0 auto; }
  .brand{ display:flex; align-items:center; gap:10px; margin-bottom: 26px; }
  .brand-mark{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size: 14px; letter-spacing: 2px;
    color: var(--void);
    background: linear-gradient(90deg, var(--neon-pink), var(--neon-purple));
    padding: 4px 10px; border-radius: 3px;
    box-shadow: 0 0 16px rgba(255,46,151,0.55);
  }
  .brand-name{
    font-family:'Orbitron', sans-serif; font-weight:800; font-size: 15px; letter-spacing: 3px;
    color: var(--neon-cyan); text-shadow: 0 0 10px rgba(0,240,255,0.6);
  }
  h1.title{
    font-family:'Orbitron', sans-serif; font-weight:800;
    font-size: clamp(28px, 5vw, 44px); line-height: 1.15; margin: 0 0 14px;
    letter-spacing: -0.01em; max-width: 680px; text-transform: uppercase;
  }
  h1.title .glow-pink{ color: var(--neon-pink); text-shadow: 0 0 18px rgba(255,46,151,0.7), 0 0 40px rgba(255,46,151,0.35); }
  h1.title .glow-cyan{ color: var(--neon-cyan); text-shadow: 0 0 18px rgba(0,240,255,0.7), 0 0 40px rgba(0,240,255,0.35); }
  p.subtitle{ color: var(--muted); font-size: 16px; font-weight: 500; margin: 0 0 30px; max-width: 540px; }

  .search-row{ display:flex; gap: 10px; flex-wrap: wrap; }
  .search-box{ flex: 1 1 320px; position: relative; }
  .search-box input{
    width: 100%; background: rgba(21,15,40,0.85); border: 1px solid var(--line-bright); color: var(--text);
    padding: 15px 18px 15px 44px; border-radius: 4px; font-size: 15px;
    font-family: 'Rajdhani', sans-serif; font-weight: 500; outline: none;
    transition: box-shadow .2s ease, border-color .2s ease;
  }
  .search-box input::placeholder{ color: var(--muted); }
  .search-box input:focus{ border-color: var(--neon-cyan); box-shadow: 0 0 0 1px var(--neon-cyan), 0 0 18px rgba(0,240,255,0.35); }
  .search-box svg{ position:absolute; left:15px; top:50%; transform:translateY(-50%); width:18px; height:18px; stroke: var(--neon-cyan); }
  .search-clear{
    position:absolute; right:12px; top:50%; transform:translateY(-50%);
    width:26px; height:26px; border-radius:50%; border:1px solid var(--line);
    background: rgba(58,42,92,0.6); color: var(--muted); cursor:pointer;
    display:none; align-items:center; justify-content:center; font-size:15px; line-height:1;
  }
  .search-clear:hover{ border-color: var(--neon-pink); color: var(--neon-pink); }
  .search-clear.visible{ display:flex; }
  select.sort-select{
    background: rgba(21,15,40,0.85); border: 1px solid var(--line-bright); color: var(--neon-cyan);
    border-radius: 4px; padding: 5px 12px; font-size: 12.5px; font-family: 'Share Tech Mono', monospace;
    letter-spacing: 0.5px; text-transform: uppercase; cursor:pointer;
  }
  select.year-select{
    background: rgba(21,15,40,0.85); border: 1px solid var(--line-bright); color: var(--text);
    border-radius: 4px; padding: 0 16px; font-size: 14px; font-family: 'Rajdhani', sans-serif; font-weight: 500; cursor:pointer;
  }

  .filters{ max-width: 1180px; margin: -95px auto 0; padding: 0 24px; display:flex; gap: 8px; flex-wrap: wrap; align-items:center; position: relative; z-index: 20; }
  .filter-group{ position: relative; }
  select.filter-select{
    background: rgba(21,15,40,0.85); border: 1px solid var(--line-bright); color: var(--text);
    border-radius: 100px; padding: 7px 14px; font-size: 12.5px; font-family: 'Rajdhani', sans-serif;
    font-weight: 600; cursor:pointer; max-width: 170px;
  }
  select.filter-select:focus{ outline:none; border-color: var(--neon-cyan); }
  .clear-filters-btn{
    background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red);
    padding: 7px 14px; border-radius: 100px; font-size: 11px; font-weight:700;
    font-family:'Share Tech Mono', monospace; letter-spacing:0.5px; text-transform:uppercase;
    cursor:pointer; transition: all .15s ease;
  }
  .clear-filters-btn:hover{ background: rgba(255,56,96,0.12); box-shadow: 0 0 10px rgba(255,56,96,0.3); }
  .clear-filters-btn{
    background: transparent; border: 1px solid var(--neon-red); color: var(--neon-red);
    padding: 9px 16px; border-radius: 100px; font-size: 12px; font-weight:700;
    font-family:'Share Tech Mono', monospace; letter-spacing:0.5px; text-transform:uppercase;
    cursor:pointer; transition: all .15s ease;
  }
  .clear-filters-btn:hover{ background: rgba(255,56,96,0.12); box-shadow: 0 0 10px rgba(255,56,96,0.3); }
  .chip-row{ display:flex; gap:7px; flex-wrap:wrap; }
  .chip{
    background: rgba(21,15,40,0.9); border: 1px solid var(--line); color: var(--muted);
    padding: 6px 13px; border-radius: 100px; font-size: 13px; font-weight: 600;
    cursor: pointer; transition: all .15s ease; white-space: nowrap;
  }
  .chip:hover{ border-color: var(--neon-purple); color: var(--text); }
  .chip.active{
    background: var(--neon-pink); border-color: var(--neon-pink); color: #1a0510;
    font-weight: 700; box-shadow: 0 0 12px rgba(255,46,151,0.55);
  }

  .results-bar{
    max-width: 1180px; margin: 18px auto 0; padding: 0 24px;
    display:flex; justify-content: space-between; align-items:center;
    color: var(--muted); font-size: 13px; font-family: 'Share Tech Mono', monospace; letter-spacing: 0.5px;
  }

  main{ max-width: 1180px; margin: 0 auto; padding: 18px 24px 80px; }
  .grid{ display:grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 20px; margin-top: 12px; }
  .card{
    background: linear-gradient(160deg, rgba(28,20,54,0.9), rgba(21,15,40,0.9));
    border: 1px solid var(--line); border-radius: 6px; overflow: hidden;
    display:flex; flex-direction: column;
    transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
  }
  .card:hover{ transform: translateY(-4px); border-color: var(--neon-cyan); box-shadow: 0 0 22px rgba(0,240,255,0.25); }
  .card-image-wrap{ width:100%; aspect-ratio: 3/4; background: var(--panel-2); overflow:hidden; }
  .card-image{ width:100%; height:100%; object-fit: cover; object-position: center top; display:block; }
  .card{ cursor: pointer; }
  .card-body{ padding: 15px 15px 17px; display:flex; flex-direction: column; gap: 9px; flex:1; }
  .card-top{ display:flex; justify-content: space-between; align-items:flex-start; gap: 10px; }
  .card-title{ font-family:'Rajdhani', sans-serif; font-weight:700; font-size: 16px; line-height:1.25; }
  .score-chip{
    font-family:'Share Tech Mono', monospace; font-weight:700; font-size: 13px;
    padding: 3px 8px; border-radius: 4px; flex-shrink:0; min-width: 36px; text-align:center;
  }
  .score-high{ background: rgba(0,240,255,0.12); color: var(--neon-cyan); border:1px solid rgba(0,240,255,0.4); text-shadow: 0 0 8px rgba(0,240,255,0.5);}
  .score-mid{ background: rgba(255,225,77,0.12); color: var(--neon-yellow); border:1px solid rgba(255,225,77,0.4);}
  .score-low{ background: rgba(255,56,96,0.12); color: var(--neon-red); border:1px solid rgba(255,56,96,0.4);}
  .score-none{ background: var(--panel-2); color: var(--muted); border:1px solid var(--line); }

  .card-meta{ display:flex; flex-wrap:wrap; gap: 5px; font-size: 11.5px; color: var(--muted); }
  .tag{
    background: rgba(168,85,247,0.1); border: 1px solid rgba(168,85,247,0.35); color: #c9a8f5;
    padding: 2px 9px; border-radius: 100px; font-weight: 600;
  }
  .card-actions{ margin-top: auto; display:flex; gap: 8px; padding-top: 7px; }
  .card-actions a{
    flex:1; text-align:center; text-decoration: none; font-size: 12.5px; font-weight:700;
    padding: 9px 6px; border-radius: 4px; font-family:'Rajdhani', sans-serif;
    border: 1px solid var(--line); color: var(--text); transition: all .15s ease;
    text-transform: uppercase; letter-spacing: 0.5px;
  }
  .card-actions a.trailer:hover{ border-color: var(--neon-pink); color: var(--neon-pink); box-shadow: 0 0 10px rgba(255,46,151,0.4); }
  .card-actions a.walkthrough:hover{ border-color: var(--neon-yellow); color: var(--neon-yellow); box-shadow: 0 0 10px rgba(255,225,77,0.4); }

  .state-msg{ text-align:center; padding: 70px 20px; color: var(--muted); font-family:'Share Tech Mono', monospace; font-size: 13.5px; }
  .state-msg .big{ font-family:'Orbitron', sans-serif; font-size: 17px; color: var(--neon-cyan); margin-bottom: 10px; font-weight: 800; text-transform: uppercase; }
  .spinner{
    width:28px; height:28px; border: 3px solid var(--line); border-top-color: var(--neon-pink);
    border-radius:50%; margin: 0 auto 16px; animation: spin 0.8s linear infinite;
    box-shadow: 0 0 12px rgba(255,46,151,0.4);
  }
  @keyframes spin{ to{ transform: rotate(360deg); } }

  .load-more-wrap{ display:flex; justify-content:center; margin-top: 32px; }
  .load-more{
    background: transparent; border: 1px solid var(--line-bright); color: var(--text);
    padding: 13px 28px; border-radius: 4px; font-family:'Share Tech Mono', monospace;
    font-size: 13px; letter-spacing: 1px; text-transform: uppercase; cursor:pointer; transition: all .15s ease;
  }
  .load-more:hover{ border-color: var(--neon-cyan); color: var(--neon-cyan); box-shadow: 0 0 14px rgba(0,240,255,0.35); }
  .load-more:disabled{ opacity:0.5; cursor:default; }

  @media (max-width: 640px){
    header.hero{ padding: 32px 16px 40px; }
    .horizon::before, .horizon::after{ opacity: 0.3; }
    .filters{ margin-top: 0; gap: 8px; width: 100%; }
    .filter-group{ min-width: 0; }
    .filters, .results-bar, main{ padding-left:16px; padding-right:16px; box-sizing:border-box; width:100%; }
    .search-row{ flex-direction: column; }
    .search-row .search-box{ flex: none; }
    .search-row select.year-select{ width: 100%; height: 44px; flex: none; }
    .results-bar{ flex-direction: row; justify-content:space-between; align-items:center; gap:8px; margin-top:12px; }

    .chip-row{ flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 4px; scrollbar-width: none; width: 100%; max-width: 100%; }
    .chip-row::-webkit-scrollbar{ display: none; }
    .chip{ flex-shrink: 0; }

    .grid{ grid-template-columns: 1fr; gap: 12px; }
    .card{ flex-direction: row; }
    .card-image-wrap{ width: 96px; flex-shrink: 0; aspect-ratio: auto; align-self: stretch; }
    .card-body{ padding: 10px 12px; gap: 6px; min-width: 0; }
    .card-title{ font-size: 14px; }
    .card-meta{ gap: 4px; }
    .tag{ font-size: 10.5px; padding: 1px 7px; }
    .card-actions{ flex-direction: row; padding-top: 4px; }
    .card-actions a{ font-size: 11px; padding: 7px 4px; }
    .score-chip{ font-size: 12px; padding: 2px 6px; min-width: 30px; }

    .modal{ max-height: 94vh; }
    .modal-body{ padding: 18px 16px 22px; }
    .modal-title{ font-size: 19px; }
    .lightbox-nav{ width:38px; height:38px; font-size:18px; }
    .lightbox-prev{ left: 8px; }
    .lightbox-next{ right: 8px; }
  }
  @media (prefers-reduced-motion: reduce){
    .card, .chip, .load-more, .card-actions a{ transition: none; }
    .spinner{ animation: none; }
  }

  /* ---------- Detail modal ---------- */
  .modal-backdrop{
    position: fixed; inset:0; background: rgba(6,4,14,0.85);
    display:none; align-items:flex-start; justify-content:center;
    padding: 40px 20px; z-index: 50;
  }
  .modal-backdrop.open{ display:flex; }
  .modal{
    background: var(--panel); border:1px solid var(--line-bright); border-radius: 8px;
    max-width: 760px; width:100%; max-height: 90vh; overflow-y:auto;
    box-shadow: 0 0 40px rgba(168,85,247,0.25);
  }
  .modal-topbar{
    position: sticky; top:0; z-index: 10; display:flex; justify-content:flex-end;
    padding: 10px; background: linear-gradient(180deg, rgba(5,4,10,0.85), transparent);
  }
  .modal-close{
    width:36px; height:36px; border-radius:50%;
    background: rgba(10,7,20,0.85); border:1px solid var(--line-bright); color: var(--text);
    cursor:pointer; font-size:17px; display:flex; align-items:center; justify-content:center;
  }
  .modal-close:hover{ border-color: var(--neon-pink); color: var(--neon-pink); }
  .modal-header{ position:relative; background: #05040a; display:flex; align-items:center; justify-content:center; }
  .modal-cover{ width:100%; max-height: 420px; object-fit: contain; display:block; }
  .modal-body{ padding: 22px 26px 28px; }
  .modal-title{ font-family:'Orbitron', sans-serif; font-weight:800; font-size:22px; margin:0 0 10px; }
  .modal-meta{ display:flex; flex-wrap:wrap; gap:6px; margin-bottom:16px; }
  .modal-summary{ color: var(--text); line-height:1.6; font-size:15px; margin: 0 0 20px; }
  .modal-shots{ display:grid; grid-template-columns: repeat(auto-fill, minmax(140px,1fr)); gap:8px; margin-bottom:22px; }
  .modal-shots img{ width:100%; aspect-ratio:16/9; object-fit:cover; border-radius:4px; border:1px solid var(--line); cursor: zoom-in; transition: border-color .15s ease; }
  .modal-shots img:hover{ border-color: var(--neon-cyan); }
  .modal-actions{ display:flex; gap:10px; }
  .modal-actions a{
    flex:1; text-align:center; text-decoration:none; padding:12px; border-radius:4px;
    font-family:'Rajdhani',sans-serif; font-weight:700; text-transform:uppercase; letter-spacing:0.5px;
    border:1px solid var(--line-bright); color: var(--text); transition: all .15s ease;
  }
  .modal-actions a.trailer:hover{ border-color: var(--neon-pink); color: var(--neon-pink); }
  .modal-actions a.walkthrough:hover{ border-color: var(--neon-yellow); color: var(--neon-yellow); }
  .modal-loading{ padding: 60px 20px; text-align:center; color: var(--muted); font-family:'Share Tech Mono',monospace; }
  .lightbox{
    position: fixed; inset:0; background: rgba(4,3,10,0.94); z-index: 60;
    display:none; align-items:center; justify-content:center; padding: 30px;
  }
  .lightbox.open{ display:flex; }
  .lightbox img{ max-width: 100%; max-height: 90vh; border-radius: 4px; box-shadow: 0 0 40px rgba(0,240,255,0.2); }
  .lightbox-close{
    position:absolute; top:20px; right:24px; width:38px; height:38px; border-radius:50%;
    background: rgba(10,7,20,0.8); border:1px solid var(--line-bright); color: var(--text);
    cursor:pointer; font-size:20px; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-close:hover{ border-color: var(--neon-pink); color: var(--neon-pink); }
  .lightbox-nav{
    position:absolute; top:50%; transform:translateY(-50%); width:46px; height:46px; border-radius:50%;
    background: rgba(10,7,20,0.8); border:1px solid var(--line-bright); color: var(--text);
    cursor:pointer; font-size:22px; display:flex; align-items:center; justify-content:center;
  }
  .lightbox-nav:hover{ border-color: var(--neon-cyan); color: var(--neon-cyan); }
  .lightbox-prev{ left: 16px; }
  .lightbox-next{ right: 16px; }
  .lightbox-counter{
    position:absolute; bottom:18px; left:50%; transform:translateX(-50%);
    font-family:'Share Tech Mono',monospace; font-size:12px; color: var(--muted);
    background: rgba(10,7,20,0.7); padding:4px 12px; border-radius:100px; border:1px solid var(--line);
  }
</style>
</head>
<body>

<div class="horizon">
  <header class="hero">
    <div class="brand">
      <span class="brand-mark">GV // 2087</span>
      <span class="brand-name">GAMEVAULT</span>
    </div>
    <h1 class="title">Βρες το επόμενο <span class="glow-pink">παιχνίδι</span> σου <span class="glow-cyan">απόψε</span></h1>
    <p class="subtitle">Αναζήτηση, βαθμολογίες, στιγμιότυπα, trailers και walkthroughs — μέσα από το IGDB.</p>

    <div class="search-row">
      <div class="search-box">
        <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="Αναζήτηση τίτλου (π.χ. Elden Ring, Zelda...)">
        <button id="searchClear" class="search-clear" type="button" aria-label="Καθαρισμός αναζήτησης">✕</button>
      </div>
      <select id="yearSelect" class="year-select"></select>
    </div>
  </header>
</div>

<div class="filters">
  <select id="genreSelect" class="filter-select"><option value="">Όλα τα genre</option></select>
  <select id="platformSelect" class="filter-select">
    <option value="">Όλες οι πλατφόρμες</option>
    <option value="6">PC (Microsoft Windows)</option>
    <option value="167">PlayStation 5</option>
    <option value="48">PlayStation 4</option>
    <option value="169">Xbox Series X|S</option>
    <option value="49">Xbox One</option>
    <option value="130">Nintendo Switch</option>
  </select>
  <div class="filter-group">
    <div class="chip-row" id="ratingRow" style="position:static;display:flex;background:none;border:none;box-shadow:none;padding:0;">
      <span class="chip active" data-rating="0">Rating: Όλα</span>
      <span class="chip" data-rating="60">60+</span>
      <span class="chip" data-rating="75">75+</span>
      <span class="chip" data-rating="90">90+</span>
    </div>
  </div>
  <button class="clear-filters-btn" id="clearFiltersBtn">Καθαρισμός φίλτρων</button>
</div>

<div class="results-bar">
  <span id="resultsCount">—</span>
  <select id="sortSelect" class="sort-select">
    <option value="popular">SORT: ΔΗΜΟΦΙΛΗ</option>
    <option value="rating">SORT: RATING</option>
    <option value="newest">SORT: ΝΕΟΤΕΡΑ</option>
    <option value="upcoming">SORT: ΠΡΟΣΕΧΩΣ</option>
  </select>
</div>

<main>
  <div id="grid" class="grid"></div>
  <div id="stateMsg"></div>
  <div class="load-more-wrap" id="loadMoreWrap" style="display:none;">
    <button class="load-more" id="loadMoreBtn">Περισσότερα παιχνίδια</button>
  </div>
</main>

<div class="modal-backdrop" id="modalBackdrop">
  <div class="modal" id="modalContent"></div>
</div>

<div class="lightbox" id="lightbox">
  <button class="lightbox-close" id="lightboxClose">✕</button>
  <button class="lightbox-nav lightbox-prev" id="lightboxPrev" aria-label="Προηγούμενο στιγμιότυπο">‹</button>
  <button class="lightbox-nav lightbox-next" id="lightboxNext" aria-label="Επόμενο στιγμιότυπο">›</button>
  <img id="lightboxImg" src="" alt="Στιγμιότυπο σε μεγέθυνση">
  <span class="lightbox-counter" id="lightboxCounter"></span>
</div>

<script>
(function(){
  const PROXY_URL = "https://odtbtugzilxsfqxlpofq.supabase.co/functions/v1/igdb-proxy";
  const IMG_BASE = "https://images.igdb.com/igdb/image/upload";

  const grid = document.getElementById("grid");
  const stateMsg = document.getElementById("stateMsg");
  const resultsCount = document.getElementById("resultsCount");
  const searchInput = document.getElementById("searchInput");
  const yearSelect = document.getElementById("yearSelect");
  const genreSelect = document.getElementById("genreSelect");
  const platformSelect = document.getElementById("platformSelect");
  const ratingRow = document.getElementById("ratingRow");
  const loadMoreWrap = document.getElementById("loadMoreWrap");
  const loadMoreBtn = document.getElementById("loadMoreBtn");
  const searchClear = document.getElementById("searchClear");
  const modalBackdrop = document.getElementById("modalBackdrop");
  const modalContent = document.getElementById("modalContent");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = document.getElementById("lightboxImg");
  const lightboxClose = document.getElementById("lightboxClose");
  const lightboxPrev = document.getElementById("lightboxPrev");
  const lightboxNext = document.getElementById("lightboxNext");
  const lightboxCounter = document.getElementById("lightboxCounter");
  let lightboxShots = [];
  let lightboxIndex = 0;

  function showLightbox(index){
    lightboxIndex = (index + lightboxShots.length) % lightboxShots.length;
    lightboxImg.src = lightboxShots[lightboxIndex].replace("t_screenshot_big", "t_1080p");
    lightboxCounter.textContent = `${lightboxIndex + 1} / ${lightboxShots.length}`;
    lightbox.classList.add("open");
  }

  lightboxClose.addEventListener("click", () => lightbox.classList.remove("open"));
  lightboxPrev.addEventListener("click", () => showLightbox(lightboxIndex - 1));
  lightboxNext.addEventListener("click", () => showLightbox(lightboxIndex + 1));
  lightbox.addEventListener("click", (e) => { if(e.target === lightbox) lightbox.classList.remove("open"); });

  let state = { search:"", genre:"", platform:"", rating:0, year:"", sort:"popular", offset:0, loading:false };
  let debounceTimer = null;
  const PAGE_SIZE = 24;

  const currentYear = new Date().getFullYear();
  let yearOptions = `<option value="">Όλα τα έτη</option>`;
  for(let y = currentYear + 1; y >= 1995; y--) yearOptions += `<option value="${y}">${y}</option>`;
  yearSelect.innerHTML = yearOptions;

  async function igdb(endpoint, query){
    const res = await fetch(PROXY_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ endpoint, query })
    });
    if(!res.ok) throw new Error("HTTP " + res.status);
    return res.json();
  }

  fetchGenres();
  fetchGames(true);

  genreSelect.addEventListener("change", () => {
    state.genre = genreSelect.value;
    state.offset = 0;
    fetchGames(true);
  });

  platformSelect.addEventListener("change", () => {
    state.platform = platformSelect.value;
    state.offset = 0;
    fetchGames(true);
  });

  searchInput.addEventListener("input", () => {
    searchClear.classList.toggle("visible", searchInput.value.length > 0);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(() => {
      state.search = searchInput.value.trim();
      state.offset = 0;
      fetchGames(true);
    }, 450);
  });

  searchClear.addEventListener("click", () => {
    searchInput.value = "";
    searchClear.classList.remove("visible");
    state.search = "";
    state.offset = 0;
    fetchGames(true);
    searchInput.focus();
  });

  modalBackdrop.addEventListener("click", (e) => {
    if(e.target === modalBackdrop) closeModal();
  });
  document.addEventListener("keydown", (e) => {
    if(lightbox.classList.contains("open")){
      if(e.key === "Escape") lightbox.classList.remove("open");
      if(e.key === "ArrowLeft") showLightbox(lightboxIndex - 1);
      if(e.key === "ArrowRight") showLightbox(lightboxIndex + 1);
    } else if(e.key === "Escape"){
      closeModal();
    }
  });
  function closeModal(){
    modalBackdrop.classList.remove("open");
    modalContent.innerHTML = "";
    if(history.state && history.state.gvModal) history.back();
  }

  window.addEventListener("popstate", () => {
    if(modalBackdrop.classList.contains("open")){
      modalBackdrop.classList.remove("open");
      modalContent.innerHTML = "";
    }
  });

  async function openGameDetail(gameId, gameName){
    modalBackdrop.classList.add("open");
    history.pushState({ gvModal: true }, "", "#game-" + gameId);
    modalContent.innerHTML = `<div class="modal-topbar"><button class="modal-close" id="modalCloseBtn">✕</button></div><div class="modal-loading"><div class="spinner"></div>ΦΟΡΤΩΣΗ ΛΕΠΤΟΜΕΡΕΙΩΝ...</div>`;
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    try{
      const query = `fields name, summary, cover.image_id, screenshots.image_id, aggregated_rating, first_release_date, genres.name, platforms.name; where id = ${gameId};`;
      const data = await igdb("games", query);
      const game = (data || [])[0];
      if(!game){ modalContent.innerHTML = `<div class="modal-topbar"><button class="modal-close" id="modalCloseBtn">✕</button></div><div class="modal-loading">Δεν βρέθηκαν λεπτομέρειες.</div>`; document.getElementById("modalCloseBtn").addEventListener("click", closeModal); return; }
      renderModal(game);
    }catch(err){
      console.error("Σφάλμα λεπτομερειών:", err);
      modalContent.innerHTML = `<div class="modal-topbar"><button class="modal-close" id="modalCloseBtn">✕</button></div><div class="modal-loading">Πρόβλημα φόρτωσης. Δοκίμασε ξανά.</div>`;
      document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    }
  }

  function renderModal(game){
    const cover = game.cover && game.cover.image_id ? `${IMG_BASE}/t_1080p/${game.cover.image_id}.jpg` : "";
    const shots = (game.screenshots || []).slice(0, 6).map(s => `${IMG_BASE}/t_screenshot_big/${s.image_id}.jpg`);
    const score = game.aggregated_rating ? Math.round(game.aggregated_rating) : null;
    const year = game.first_release_date ? new Date(game.first_release_date * 1000).getFullYear() : "—";
    const genres = (game.genres || []).map(g => g.name);
    const platforms = (game.platforms || []).map(p => p.name);
    const encodedName = encodeURIComponent(game.name);

    modalContent.innerHTML = `
      <div class="modal-topbar"><button class="modal-close" id="modalCloseBtn">✕</button></div>
      <div class="modal-header">
        ${cover ? `<img class="modal-cover" src="${cover}" alt="${escapeHtml(game.name)}">` : ""}
      </div>
      <div class="modal-body">
        <h2 class="modal-title">${escapeHtml(game.name)}</h2>
        <div class="modal-meta">
          <span class="score-chip ${scoreClass(score)}">${score ?? "—"}</span>
          <span class="tag">${year}</span>
          ${genres.map(g => `<span class="tag">${escapeHtml(g)}</span>`).join("")}
          ${platforms.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join("")}
        </div>
        ${game.summary ? `<p class="modal-summary">${escapeHtml(game.summary)}</p>` : ""}
        ${shots.length ? `<div class="modal-shots">${shots.map(s => `<img src="${s}" loading="lazy" alt="Στιγμιότυπο" data-full="${s}">`).join("")}</div>` : ""}
        <div class="modal-actions">
          <a class="trailer" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodedName}+trailer">Trailer ↗</a>
          <a class="walkthrough" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodedName}+walkthrough">Walkthrough ↗</a>
        </div>
      </div>
    `;
    document.getElementById("modalCloseBtn").addEventListener("click", closeModal);
    lightboxShots = shots;
    modalContent.querySelectorAll(".modal-shots img").forEach((img, idx) => {
      img.addEventListener("click", () => showLightbox(idx));
    });
  }

  yearSelect.addEventListener("change", () => {
    state.year = yearSelect.value;
    state.offset = 0;
    fetchGames(true);
  });

  ratingRow.addEventListener("click", (e) => {
    const chip = e.target.closest(".chip");
    if(!chip) return;
    [...ratingRow.children].forEach(c => c.classList.remove("active"));
    chip.classList.add("active");
    state.rating = parseFloat(chip.dataset.rating);
    state.offset = 0;
    updateFilterLabel("ratingGroup", chip.textContent.trim());
    document.getElementById("ratingGroup").classList.remove("open");
    fetchGames(true);
  });

  const sortSelect = document.getElementById("sortSelect");
  sortSelect.addEventListener("change", () => {
    state.sort = sortSelect.value;
    state.offset = 0;
    fetchGames(true);
  });

  const clearFiltersBtn = document.getElementById("clearFiltersBtn");
  clearFiltersBtn.addEventListener("click", () => {
    state.genre = ""; state.platform = ""; state.rating = 0; state.year = ""; state.sort = "popular"; state.offset = 0;
    genreSelect.value = ""; platformSelect.value = "";
    [...ratingRow.children].forEach((c,i) => c.classList.toggle("active", i===0));
    yearSelect.value = "";
    sortSelect.value = "popular";
    fetchGames(true);
  });

  loadMoreBtn.addEventListener("click", () => {
    state.offset += PAGE_SIZE;
    fetchGames(false);
  });

  async function fetchGenres(){
    try{
      const data = await igdb("genres", "fields name; sort name asc; limit 20;");
      let html = `<option value="">Όλα τα genre</option>`;
      (data || []).forEach(g => { html += `<option value="${g.id}">${g.name}</option>`; });
      genreSelect.innerHTML = html;
    }catch(err){ console.error("Σφάλμα genres:", err); }
  }

  function buildWhere(){
    const clauses = [];
    if(state.genre) clauses.push(`genres = (${state.genre})`);
    if(state.platform) clauses.push(`platforms = (${state.platform})`);
    if(state.rating > 0) clauses.push(`aggregated_rating >= ${state.rating}`);
    if(state.year){
      const start = Math.floor(new Date(`${state.year}-01-01`).getTime()/1000);
      const end = Math.floor(new Date(`${state.year}-12-31`).getTime()/1000);
      clauses.push(`first_release_date >= ${start} & first_release_date <= ${end}`);
    }
    if(state.search){
      const words = state.search.replace(/"/g,'').trim().split(/\s+/);
      words.forEach(w => clauses.push(`name ~ *"${w}"*`));
    }
    if(state.sort === "upcoming" && !state.search){
      clauses.push(`first_release_date >= ${Math.floor(Date.now()/1000)}`);
    } else if(!state.year){
      clauses.push(`first_release_date <= ${Math.floor(Date.now()/1000)}`);
    }
    clauses.push(`cover != null`);
    if(!state.search && state.sort === "popular") clauses.push(`total_rating_count >= 10`);
    if(!state.search && state.sort === "rating") clauses.push(`aggregated_rating_count >= 3`);
    if(!state.search && state.sort === "upcoming") clauses.push(`hypes >= 3`);
    return clauses.length ? `where ${clauses.join(" & ")};` : "";
  }

  async function fetchGames(reset){
    if(state.loading) return;
    state.loading = true;

    if(reset){
      grid.innerHTML = "";
      stateMsg.innerHTML = `<div class="state-msg"><div class="spinner"></div>ΦΟΡΤΩΣΗ...</div>`;
      loadMoreWrap.style.display = "none";
    } else {
      loadMoreBtn.disabled = true;
      loadMoreBtn.textContent = "Φόρτωση...";
    }

    try{
      const sortMap = {
        popular: "sort total_rating_count desc;",
        rating: "sort aggregated_rating desc;",
        newest: "sort first_release_date desc;",
        upcoming: "sort hypes desc;"
      };
      const sortField = state.search ? "sort total_rating_count desc;" : sortMap[state.sort];
      const query = `fields name, cover.image_id, aggregated_rating, first_release_date, genres.name, platforms.name; ${buildWhere()} ${sortField} limit ${PAGE_SIZE}; offset ${state.offset};`;
      const data = await igdb("games", query);

      if(reset) stateMsg.innerHTML = "";
      resultsCount.textContent = `${(data || []).length + state.offset}+ ΑΠΟΤΕΛΕΣΜΑΤΑ`;

      if((data || []).length === 0 && state.offset === 0){
        stateMsg.innerHTML = `<div class="state-msg"><div class="big">Καμία αντιστοιχία</div>Δοκίμασε άλλον όρο αναζήτησης ή φίλτρα.</div>`;
      } else {
        data.forEach(game => grid.appendChild(renderCard(game)));
      }

      loadMoreWrap.style.display = (data && data.length === PAGE_SIZE) ? "flex" : "none";
    }catch(err){
      console.error("Σφάλμα φόρτωσης παιχνιδιών:", err);
      if(reset){
        stateMsg.innerHTML = `<div class="state-msg"><div class="big">Πρόβλημα σύνδεσης</div>Δοκίμασε ξανά σε λίγο.</div>`;
      }
    } finally {
      state.loading = false;
      loadMoreBtn.disabled = false;
      loadMoreBtn.textContent = "Περισσότερα παιχνίδια";
    }
  }

  function scoreClass(score){
    if(score === null || score === undefined) return "score-none";
    if(score >= 75) return "score-high";
    if(score >= 50) return "score-mid";
    return "score-low";
  }

  function renderCard(game){
    const card = document.createElement("div");
    card.className = "card";
    const img = game.cover && game.cover.image_id ? `${IMG_BASE}/t_cover_big/${game.cover.image_id}.jpg` : "";
    const score = game.aggregated_rating ? Math.round(game.aggregated_rating) : null;
    const year = game.first_release_date ? new Date(game.first_release_date * 1000).getFullYear() : "—";
    const dateLabel = (state.sort === "upcoming" && game.first_release_date)
      ? new Date(game.first_release_date * 1000).toLocaleDateString("el-GR", { day:"numeric", month:"short", year:"numeric" })
      : year;
    const platforms = (game.platforms || []).slice(0,3).map(p => p.name);
    const genres = (game.genres || []).slice(0,2).map(g => g.name);
    const encodedName = encodeURIComponent(game.name);

    card.innerHTML = `
      <div class="card-image-wrap">
        ${img ? `<img class="card-image" loading="lazy" src="${img}" alt="${escapeHtml(game.name)}">` : ""}
      </div>
      <div class="card-body">
        <div class="card-top">
          <div class="card-title">${escapeHtml(game.name)}</div>
          <div class="score-chip ${scoreClass(score)}">${score ?? "—"}</div>
        </div>
        <div class="card-meta">
          <span class="tag">${dateLabel}</span>
          ${genres.map(g => `<span class="tag">${escapeHtml(g)}</span>`).join("")}
          ${platforms.map(p => `<span class="tag">${escapeHtml(p)}</span>`).join("")}
        </div>
        <div class="card-actions">
          <a class="trailer" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodedName}+trailer">Trailer ↗</a>
          <a class="walkthrough" target="_blank" rel="noopener" href="https://www.youtube.com/results?search_query=${encodedName}+walkthrough">Walkthrough ↗</a>
        </div>
      </div>
    `;
    card.addEventListener("click", (e) => {
      if(e.target.closest("a")) return;
      openGameDetail(game.id, game.name);
    });
    return card;
  }

  function escapeHtml(str){
    const div = document.createElement("div");
    div.textContent = str || "";
    return div.innerHTML;
  }
})();
</script>

</body>
</html>
